name: Deploy landing page

# Builds the MkDocs site (docs/ -> _site/) and publishes it to GitHub Pages.
# Separate from build.yml (the build/release pipeline); never touches it.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: the deploy job publishes to Pages, identifies itself to the
# Pages service and reads the repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; queued runs are not cancelled so a push never
# leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pinned so the site cannot break under us: a new MkDocs/Material release
      # must be a deliberate change here.
      - name: Install MkDocs
        run: |
          python -m pip install --disable-pip-version-check \
            mkdocs==1.6.1 \
            mkdocs-material==9.7.7 \
            mkdocs-static-i18n==1.3.1

      # --strict turns a broken link or a bad reference into a failed build
      # instead of a silently wrong page.
      - name: Build the site
        run: python -m mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
