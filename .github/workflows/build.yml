name: Build & Release RedisExcel

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

# Least privilege by default: the build job only reads the repository.
# Only the release job below may write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore RedisExcel.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build the add-in (so the DNA-packaging parity test can run)
        shell: pwsh
        run: msbuild RedisExcel.sln /p:Configuration=Release /p:InformationalVersion=dev

      - name: Build every test project (catches a missing reference offline)
        shell: pwsh
        run: |
          $projects = @(
            'test/RedisExcel.Tests/RedisExcel.Tests.csproj',
            'test/SmokeTests/RedisExcel.SmokeTests.csproj',
            'test/LivenessTests/LivenessTests.csproj',
            'test/LoadTests/RedisExcel.LoadTests.csproj'
          )
          foreach ($p in $projects) {
            Write-Host "== build $p"
            dotnet build $p -c Release --nologo
            if ($LASTEXITCODE -ne 0) { throw "build failed: $p" }
          }

      - name: Run unit tests
        run: dotnet test test/RedisExcel.Tests/RedisExcel.Tests.csproj -c Release

      - name: Install Redis server (portable build, Memurai fallback)
        shell: pwsh
        run: |
          # ORDER MATTERS: the portable Redis build from the GitHub releases first
          # (a direct download, deterministic, seconds), Memurai via Chocolatey as
          # the fallback. The community feed flakes (406/504) and, when it does,
          # Chocolatey can even exit 0 after installing nothing ("Chocolatey
          # installed 0/0 packages"); that path used to be primary, so every run
          # paid 1-2 choco failures (~20s sleep each) before falling back. The
          # suites only need a Redis endpoint, and the installer's own Memurai
          # path is exercised by hand.
          #
          # ErrorActionPreference = Continue is load-bearing: the runner runs this
          # script with Stop, and a native command that writes to stderr (choco
          # prints its download errors there) then becomes a TERMINATING error, so
          # the step aborted on the first failure and never reached the fallback
          # (that is how the memurai-developer 4.1.8 download failure turned into a
          # red build). Every real failure still fails the step: the downloads use
          # -ErrorAction Stop inside the try, each branch validates what it
          # installed, and the final throw catches "neither worked".
          $ErrorActionPreference = 'Continue'
          $provisioned = $false

          try {
            Write-Host "downloading the portable Redis build (GitHub releases)"
            $zip = Join-Path $env:RUNNER_TEMP "redis-windows.zip"
            $dir = Join-Path $env:RUNNER_TEMP "redis-windows"
            Invoke-WebRequest -Uri "https://github.com/redis-windows/redis-windows/releases/download/8.10.2/Redis-8.10.2-Windows-x64-msys2.zip" -OutFile $zip -ErrorAction Stop
            Expand-Archive -Path $zip -DestinationPath $dir -Force -ErrorAction Stop
            $server = Get-ChildItem -Path $dir -Recurse -Filter "redis-server.exe" | Select-Object -First 1
            if (-not $server) { throw "redis-server.exe not found in the archive" }
            Start-Process -FilePath $server.FullName -ArgumentList "--port", "6379" -WorkingDirectory $server.DirectoryName -WindowStyle Hidden
            Write-Host "portable redis-server started from $($server.DirectoryName)"
            $provisioned = $true
          }
          catch {
            Write-Host "portable Redis failed ($($_.Exception.Message)); falling back to Memurai via Chocolatey"
          }

          if (-not $provisioned) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "memurai install attempt $attempt/3"
              choco install memurai-developer -y --no-progress
              $svc = Get-Service -Name Memurai -ErrorAction SilentlyContinue
              if ($svc) {
                Write-Host "service $($svc.Name): $($svc.Status)"
                $provisioned = $true
                break
              }
              Write-Host "memurai install failed (exit $LASTEXITCODE; no Memurai service found)"
              if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
            }
          }

          if (-not $provisioned) {
            throw "no Redis server could be provisioned (portable download and the Memurai package both failed)"
          }

      - name: Wait for Redis to answer PING
        shell: pwsh
        run: |
          # AbortOnConnectFail=False makes the smoke client swallow a server that
          # is still starting; probe the raw Redis protocol until PONG before
          # running the smoke tests. While waiting, (re)start the Memurai service:
          # a slow first start on a loaded runner must not fail the job.
          function Start-Memurai {
            $svc = Get-Service -Name Memurai -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              try { Start-Service -Name Memurai -ErrorAction Stop } catch { }
            }
          }
          Start-Memurai
          $deadline = (Get-Date).AddSeconds(120)
          $nextServiceCheck = (Get-Date)
          while ((Get-Date) -lt $deadline) {
            try {
              $client = New-Object System.Net.Sockets.TcpClient
              $client.Connect('127.0.0.1', 6379)
              $stream = $client.GetStream()
              $payload = [System.Text.Encoding]::ASCII.GetBytes("PING`r`n")
              $stream.Write($payload, 0, $payload.Length)
              $buffer = New-Object byte[] 16
              $read = $stream.Read($buffer, 0, $buffer.Length)
              $response = [System.Text.Encoding]::ASCII.GetString($buffer, 0, $read)
              $client.Close()
              if ($response -match 'PONG') { Write-Host "Redis is ready: $response"; exit 0 }
            }
            catch { }
            if ((Get-Date) -ge $nextServiceCheck) {
              Start-Memurai
              $nextServiceCheck = (Get-Date).AddSeconds(10)
            }
            Start-Sleep -Seconds 1
          }
          Get-Service -Name Memurai -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "service $($_.Name): $($_.Status)" }
          throw "Redis on 127.0.0.1:6379 did not answer PING within 120s"

      - name: Run smoke tests
        shell: pwsh
        run: |
          # The concurrency section hammers a shared server; a loaded runner can
          # trip a documented best-effort race (duplicate suppression, delivery
          # convergence) that is not an add-in defect. Retry once before failing,
          # consistent with the liveness step below; a real regression fails both.
          #
          # Continue, not the runner's Stop: a non-zero native exit (or stderr
          # output) would otherwise TERMINATE this step and the retry would never
          # run - see the Memurai step above. The $LASTEXITCODE checks and the
          # final throw below still fail the step.
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "smoke attempt $attempt/2"
            dotnet run --project test/SmokeTests -c Release -- "127.0.0.1:6379"
            if ($LASTEXITCODE -eq 0) { Write-Host "smoke passed on attempt $attempt"; exit 0 }
            Write-Host "smoke attempt $attempt failed (exit $LASTEXITCODE)"
            if ($attempt -lt 2) { Start-Sleep -Seconds 3 }
          }
          throw "smoke tests failed on both attempts"

      - name: Run liveness tests (quick)
        shell: pwsh
        run: |
          # A loaded/slow CI runner can stall the whole process for a moment (a
          # single scheduling hiccup inflates the process heartbeat, the
          # delivery gap and the chance of one transient UDF error at once),
          # which the liveness bounds rightly flag. On a healthy runner the
          # phase-B delivery gap is ~1.5-3.5s (bound 5s) and udfErrors is 0, so
          # retry before failing the job: infrastructure noise must not block a
          # release. A real regression stalls every attempt.
          #
          # Continue for the same reason as the smoke step above: the runner's
          # Stop preference would abort the step on the first native failure
          # instead of retrying it.
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "liveness attempt $attempt/3"
            dotnet run --project test/LivenessTests -c Release -- "127.0.0.1:6379" --quick --skip-restart
            if ($LASTEXITCODE -eq 0) { Write-Host "liveness passed on attempt $attempt"; exit 0 }
            Write-Host "liveness attempt $attempt failed (exit $LASTEXITCODE)"
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw "liveness tests failed on all attempts"

      - name: Verify CHANGELOG matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # A release tag must name the finalized changelog section, otherwise
          # the repo would ship an "(unreleased)" heading. Anchor the match on the
          # exact heading so a short tag (v1.5) cannot pass against v1.5.0.
          $tag = "${{ github.ref_name }}"
          $heading = (Get-Content CHANGELOG.md -TotalCount 6 | Where-Object { $_ -match '^##\s' } | Select-Object -First 1)
          if ("$heading" -notmatch ('^##\s+' + [regex]::Escape($tag) + '\s*$')) {
            throw "CHANGELOG.md top heading '$heading' does not match the tag '$tag'. Finalize the changelog (remove '(unreleased)') and set 'Current release' in AGENTS.md before tagging."
          }
          Write-Host "CHANGELOG heading matches the tag: $heading"

      - name: Build RedisExcel (.NET Framework 4.8)
        shell: pwsh
        run: |
          $tag = "dev"
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          msbuild RedisExcel.sln /p:Configuration=Release /p:InformationalVersion=$tag

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Same community-feed flake as the Memurai install above: retry
          # before failing the job on infrastructure noise. Continue, not the
          # runner's Stop, so a failed choco attempt retries instead of aborting
          # the step (see the Memurai step).
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "innosetup install attempt $attempt/3"
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -eq 0) { Write-Host "innosetup installed"; exit 0 }
            Write-Host "innosetup install failed (exit $LASTEXITCODE)"
            if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
          }
          throw "innosetup install failed on all attempts"

      # Build the helper installer on every run (so a broken .iss is caught here,
      # not only on a release tag). The version is the tag without the leading
      # 'v' (e.g. v1.5.1 -> RedisExcelSetup-1.5.1.exe), or "dev" on a branch.
      - name: Build the installer
        shell: pwsh
        run: |
          $ver = "dev"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart('v') }
          iscc "/DAppVersion=$ver" "installer\RedisExcel.iss"
          $exe = "installer\output\RedisExcelSetup-$ver.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "installer was not produced: $exe" }

          # Also publish a version-less copy so the documented one-click link
          # (releases/latest/download/RedisExcelSetup.exe) never goes stale:
          # /releases/latest resolves to the NEWEST release, whose assets carry
          # the tag in their names, so a versioned file name under that path
          # (RedisExcelSetup-1.6.0.exe) 404s as soon as the next tag ships.
          $stable = "installer\output\RedisExcelSetup.exe"
          Copy-Item -LiteralPath $exe -Destination $stable -Force
          if (-not (Test-Path -LiteralPath $stable)) { throw "stable installer copy was not produced: $stable" }
          Write-Host "installer built: $exe (stable copy: $stable)"

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: redis-excel-installer
          path: installer/output/*.exe
          if-no-files-found: error

      # Fail loudly if ANY release asset is missing: if-no-files-found only fails
      # when the whole path set matches zero files, so one missing asset among the
      # set would otherwise upload a partial (broken) release.
      - name: Verify the release assets exist
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $assets = @(
            'bin/Release/net48/publish/RedisExcel.dll',
            'bin/Release/net48/publish/RedisExcel-packed.xll',
            'bin/Release/net48/publish/RedisExcel64-packed.xll',
            'NLog.config',
            'RedisExcel.json'
          )
          $missing = $assets | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) {
            throw "release assets missing: " + ($missing -join ', ')
          }
          $installers = @(Get-ChildItem 'installer/output/*.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "release asset missing: installer/output/RedisExcelSetup-*.exe"
          }
          Write-Host ("release assets present: " + ($assets.Count + $installers.Count) + " files")

      # Hand the release assets to the release job. The artifact keeps the
      # paths relative to the repository root (bin/..., the two config files and
      # the installer), which the release job references below.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            bin/Release/net48/publish/RedisExcel.dll
            bin/Release/net48/publish/RedisExcel-packed.xll
            bin/Release/net48/publish/RedisExcel64-packed.xll
            NLog.config
            RedisExcel.json
            installer/output/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # The release job needs the repository for CHANGELOG.md (the release body).
      # Checkout MUST run before the artifact download: its default clean would
      # otherwise wipe the downloaded release-assets directory.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Extract the release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # Use the section for this tag as the release body, so the published
          # release explains what shipped (the guard above already proved the
          # heading exists). The section runs from '## <tag>' up to the next '## '.
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern ('^##\s+' + [regex]::Escape($tag) + '\s*$') | Select-Object -First 1).LineNumber
          if (-not $start) { throw "no CHANGELOG section for $tag" }
          $end = ($lines | Select-String -Pattern '^##\s' | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if (-not $end) { $end = $lines.Count + 1 }
          $body = $lines[($start)..($end - 2)] -join "`n"
          Set-Content -LiteralPath release-notes.md -Value $body -Encoding utf8
          Write-Host ("release notes: " + ($end - 1 - $start) + " lines")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Tags with a suffix (e.g. v1.2.7-rc1) publish as prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            release-assets/bin/Release/net48/publish/RedisExcel.dll
            release-assets/bin/Release/net48/publish/RedisExcel-packed.xll
            release-assets/bin/Release/net48/publish/RedisExcel64-packed.xll
            release-assets/NLog.config
            release-assets/RedisExcel.json
            release-assets/installer/output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
