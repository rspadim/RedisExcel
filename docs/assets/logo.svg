<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RedisExcel mark: a cell grid with one live (streaming) cell. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8503F"/>
      <stop offset="1" stop-color="#A61B10"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <g fill="#ffffff">
    <rect x="12" y="12" width="18" height="18" rx="4.5"/>
    <rect x="34" y="12" width="18" height="18" rx="4.5"/>
    <rect x="12" y="34" width="18" height="18" rx="4.5"/>
  </g>
  <rect x="34" y="34" width="18" height="18" rx="4.5" fill="#2EBD6B"/>
</svg>
